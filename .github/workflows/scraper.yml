name: Scraper Pipeline

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scraper-pipeline
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run scraper (single cycle)
        env:
          EXCHANGERATE_API_KEY: ${{ secrets.EXCHANGERATE_API_KEY }}
          OPEN_EXCHANGE_RATES_APP_ID: ${{ secrets.OPEN_EXCHANGE_RATES_APP_ID }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          PLAYWRIGHT_HEADLESS: "true"
        run: python main.py --once

      - name: Commit and push updated data
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "chore: update rate data [skip ci]"

          for attempt in 1 2 3 4 5; do
            git pull --rebase origin "$BRANCH"
            if git push origin "HEAD:$BRANCH"; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push failed on attempt $attempt, retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to push after 5 attempts"
          exit 1

      - name: Upload data artifact for Pages
        uses: actions/upload-artifact@v4
        with:
          name: pages-data
          path: data/
          retention-days: 7

  deploy-pages:
    needs: scrape
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download scraped data
        uses: actions/download-artifact@v4
        with:
          name: pages-data
          path: data

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          mkdir -p _site/data
          cp -r data/* _site/data/

      - name: Upload data artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
